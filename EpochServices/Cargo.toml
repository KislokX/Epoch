# EpochServices — the program a second machine runs (ADR-0029 §9).
#
# **It depends on `epoch-kernel` and on nothing else of Epoch's, and that is enforced here
# rather than remembered.** Linking `epoch-engine` would put Quests, Chronicles, Knowledge,
# Trust and MCP inside a program the ADR says must own none of them — so the boundary is a line
# in this file that a reviewer can check, instead of a rule somebody has to keep in mind.
#
# Its own workspace, deliberately. It is a separate program with a separate installer and a
# separate release; sharing Epoch's workspace would make "cargo build" in one build the other,
# and the two are not shipped together.
[workspace]

[package]
name = "epoch-services"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# **1.90, and it is Epoch's number rather than this program's own.** EpochServices links five
# crates from `BUILD/crates`, which belong to a workspace that needs 1.90, so building this from
# the tree needs 1.90 whatever its own dependencies would have allowed. Measured rather than
# assumed: with the shared crates left at 1.88, `cargo +1.88.0 check --locked` names them.
#
# The published repository reaches those same crates by revision, so the floor travels with
# them. A lower number here would be a claim nobody could build.
rust-version = "1.90"
description = "Lends a machine's models to an Epoch Host, over a paired connection."
# **Not publishable, and the four path dependencies say so.** This is an application, shipped as
# an installer rather than as a crate, and it reaches into Epoch's workspace by path — which
# crates.io does not accept. `publish = true` would therefore be a claim that is false today.
publish = false

[dependencies]
epoch-kernel = { path = "../BUILD/crates/epoch-kernel" }
# What a machine can run, and what a model costs to run there.
#
# **Not the Engine, and that is the whole point of it being a separate crate.** This program needs
# to weigh a model against *this* machine before pulling it — the same question Epoch's Workshop
# asks — and the alternative was a second copy of weighing, searching and pulling that would
# drift from the first. It contains no Quests, no Chronicles, no Trust and no domain types at
# all: a model's size is a fact about a file.
epoch-models = { path = "../BUILD/crates/epoch-models" }
# What a file *is*, read from its own bytes. The same reader the Host uses — a second one
# would be a second answer to "what did I just download".
epoch-assets = { path = "../BUILD/crates/epoch-assets" }
# The same credential store Epoch uses, on whichever operating system this is.
epoch-secrets = { path = "../BUILD/crates/epoch-secrets" }
# How the two machines speak, and how each knows who the other is. **The same implementation the
# Host uses** — a handshake written twice is two handshakes, and that is the one place a
# difference of opinion is a vulnerability rather than a bug.
epoch-wire = { path = "../BUILD/crates/epoch-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Blocking, like the Engine's: this program is one request at a time and needs no async runtime
# to be one.
ureq = { version = "2", features = ["json", "tls"] }
tiny_http = "0.12"
# **The Host's door is encrypted, and this is what encrypts it.** Not `tiny_http`'s TLS: that
# feature is built on `rustls` 0.20, and answering "this traffic is in clear text" with a 2021 TLS
# stack is answering an audit with a line for the next one. See `wire.rs`.
#
# The same 0.23 `epoch-secrets` and `ureq` already resolve to, so the identity made there and the
# server built here are the same types rather than two that look alike.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
getrandom = "0.2"
# One window, and it is a view of the server this program already had to be.
#
# No plugins and no frontend build: the page is a Rust string, so there is no bundler, no `ui/`
# folder and nothing to keep in step with Epoch's. What it costs is a webview — already present
# on Windows and macOS, and `webkit2gtk` on Linux.
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
