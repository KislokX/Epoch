# What may enter the dependency tree of the program somebody lends you a machine with.
#
# **Its own file rather than a shared one, because the two programs do not ship to the same
# machines.** Epoch builds for Windows; EpochServices is already running on a Mac, which is the
# whole point of it — a graphics card on the network belongs to whatever computer has one. So the
# target list here is wider by two, and that is a difference between the products rather than an
# oversight in one of them.
#
# **Linux is on this list because this program ships Linux.** `epochservices.yml` builds
# `ubuntu-22.04` and publishes a `.deb` and an `.AppImage` with provenance beside the `.dmg` and
# the `.msi` — so leaving it off meant a platform going out of the door unaudited, which is the
# one thing a dependency policy exists to prevent. Found by the second audit (2026-09-07,
# finding 7) and confirmed by reading the workflow rather than the comment above it.
#
# The comment this replaces said Linux would stay off "until an installer for it exists", and
# warned of **ten** unmaintained GTK3 advisories. Both were out of date: the installer exists and
# is published, and adding the target today fires exactly **one** — measured, not remembered.
# A note describing a future that has already happened is how a platform stays unaudited while
# the file explains why that is fine.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"

# The same five `unic-*` crates as Epoch, arriving the same way: `tauri -> tauri-utils ->
# urlpattern -> unic-*`. Pure Unicode data tables, unmaintained rather than vulnerable, and not a
# dependency this program chose or can drop without dropping Tauri.
#
# Reviewed 2026-09-07, read from what the tool printed rather than copied across on the
# assumption that both trees hold the same crates. They do here; that was checked, not inherited.
ignore = [
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
    # And one that only Linux brings: `proc-macro-error` reaches the tree through
    # `glib-macros -> glib -> gtk`, which is Tauri's Linux backend.
    #
    # Ignored with the reason written down rather than left to fail the build, because the
    # alternative is auditing no Linux at all — which is what this file did until today, and
    # which hides every future advisory on that platform along with this one.
    #
    # It is a **build-time** proc macro: it runs in the compiler and is not in the shipped
    # binary. The advisory is *unmaintained*, not a vulnerability, and RustSec says plainly
    # "No safe upgrade is available!" — the move has to happen in `glib-macros`, upstream of
    # anything this repository controls. Re-measured 2026-09-08: one advisory, this one.
    "RUSTSEC-2024-0370", # proc-macro-error, via glib-macros -> gtk (Linux only)
]

[licenses]
# Permissive only, and named individually. "Everything except X" is a policy that silently
# accepts whatever gets invented next.
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
