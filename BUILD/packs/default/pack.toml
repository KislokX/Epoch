# The default World.
#
# Ships archetype-descriptive placeholders on purpose. The official Epoch cast, lore and
# visual identity are a deliberately deferred creative milestone
# (docs/Milestones/Official Epoch Universe.md) - we do not invent a cast as filler.
#
# Hard rule (CONTENT_PHILOSOPHY.md): only original / commissioned / open-source /
# public-domain-CC0 / explicitly redistributable content ships here. Never copyrighted
# assets, casts or locations.

[pack]
id = "default"
name = "Default World"
version = "0.1.0"
# What this World is, in its own words. Optional and never interpreted by the Engine - it
# exists because a Launcher that can only say a World's NAME has nothing to tell you about a
# place you have not been to yet.
# No backdrop, deliberately.
#
# The mechanism exists (`backdrop = "assets/sky.png"`) and works, but the kit illustration is
# the WRONG KIND of image for it: it is key art, with its own horizon, mountains and light. Put
# behind this World's terrain it fought it - two horizons, two light directions, and the real
# geography reduced to litter on top of a painting.
#
# A backdrop wants sky: a gradient, haze, distant nothing. Something the terrain can sit in
# front of rather than compete with. The same illustration is doing its proper job as this
# World's key art on the bridge, where it is the whole picture.
kind = "REFERENCE WORLD"
description = "The World every other World is measured against. It covers every concept the Engine knows, so nothing here falls through to a placeholder - which makes it the only place where a gap means a real gap."

# No artwork in this repository. A World with no artwork is complete rather than
# unfinished: the Engine draws its own windows, and a place with no sprite is drawn from
# its authored shapes. Import your own with ADD ART on the bridge.
[license]
type = "CC0-1.0"
holder = "Epoch"
notes = "Original placeholder content authored for Epoch. Contains no third-party assets."

# ---------------------------------------------------------------------------
# CHARACTERS
# ---------------------------------------------------------------------------
#
# This World declares NO characters, and neither does any other (ADR-0023).
#
# A World supplies places, land, roads and artwork. The cast belongs to the user: names,
# faces, personalities and routines live in the vault, and each character declares which
# Worlds they live in. That is why moving somebody between Worlds is an edit to *them*, and
# why a shipped World Pack cannot be expected to know who you invented.
#
# A character's appearance still goes through EXACTLY the same pipeline as a Place's: the
# same Mark, the same asset resolution, the same confinement, the same honest degradation.
# It is not a second system - it is the same one, pointed at somebody instead of somewhere.

# ===========================================================================
# PLACES  (ADR-0021, ADR-0022)
# ===========================================================================
#
# A Place is the visible projection of a capability. It is not a building and not
# decoration: remove the capability and the Place has nothing to project.
#
# Each block below is ONE Place, complete. Identity, meaning, position, everything drawn
# and every named point live together, because keeping them in three separate sections of
# a manifest is how they drift apart.
#
# What a World writes here is a CONTRIBUTION - a patch over a stable identity. Every field
# is optional. Another World layered on top may replace the title, swap one mark, add a
# decoration or move the spawn point, and say nothing about the rest.
#
# MARKS are the drawn parts, in draw order. A mark with a `key` can be replaced by name by
# a later contribution; a mark without one is anonymous and purely additive.
#
# ANCHORS are named points other systems use: where inhabitants stand, where the name sits.
# They are keyed by role, because "where is the spawn point" must have one answer.
#
# COORDINATES inside a Place are FOOTPRINT UNITS: 1.0 is the Place's footprint, the origin
# is the base centre, y grows downward. So a Place scales with whatever footprint it was
# authored at, and its parts stay in proportion.
#
# TONES are colour ROLES, not colours: wall / roof / detail / accent / shadow. That lets an
# inhabited place light up without touching geometry.
#
# Every silhouette says what the Place is (Build From Life 18).

# ---------------------------------------------------------------------------
# The Library - knowledge is kept and guarded here.
#
# Tall, colonnaded, a peaked roof. Isolated across the river: focus, and one connection.
[places.knowledge_center]
concept = "knowledge_center"
title = "The Library"
subtitle = "Where knowledge is kept"
at = { x = 2420.0, y = 1120.0 }
footprint = 140.0

[[places.knowledge_center.marks]]
key = "shadow"
role = "shadow"
renderer = "shape"
shape = [ { form = "ellipse", tone = "shadow", x = 0.0, y = 0.0, w = 0.62, h = 0.17 } ]

[[places.knowledge_center.marks]]
key = "body"
role = "visual"
renderer = "shape"
shape = [
  { form = "polygon", tone = "roof", points = [[-0.59, -1.05], [0.0, -1.49], [0.59, -1.05]] },
  { form = "rect", tone = "wall", x = -0.5, y = -1.05, w = 1.0, h = 1.05 },
  { form = "rect", tone = "detail", x = -0.36, y = -0.86, w = 0.11, h = 0.86 },
  { form = "rect", tone = "detail", x = -0.16, y = -0.86, w = 0.11, h = 0.86 },
  { form = "rect", tone = "detail", x = 0.05, y = -0.86, w = 0.11, h = 0.86 },
  { form = "rect", tone = "detail", x = 0.25, y = -0.86, w = 0.11, h = 0.86 },
]

[[places.knowledge_center.anchors]]
role = "spawn"
x = 0.66
y = 0.0

[[places.knowledge_center.anchors]]
role = "label"
x = 0.0
y = 0.42

# ---------------------------------------------------------------------------
# The Laboratory - models and providers are explored here.
#
# On a plateau at the mountains' foot: experimentation, set apart.
#
# This Place draws from an ASSET rather than authored geometry (ADR-0020). Point `asset` at a
# different file and it changes on the next World load: no Rust, no React, no recompile. It
# has already survived that: an authored SVG, then pixel art, with no engine change between
# them - which is what "raster and vector travel the same path" was claiming.
#
# Its spawn and shadow are wider than everyone else's because its sprite is 1.7x its
# footprint. That is the whole point of anchors being World data: the overlap between an
# inhabitant's activity text and this building used to be a constant in the renderer, which
# meant one Place's proportions were quietly deciding how every Place behaved.
[places.research_lab]
concept = "research_lab"
title = "The Laboratory"
subtitle = "Where models and providers are explored"
at = { x = 720.0, y = 715.0 }
footprint = 125.0

[[places.research_lab.marks]]
key = "shadow"
role = "shadow"
renderer = "shape"
shape = [ { form = "ellipse", tone = "shadow", x = 0.0, y = 0.0, w = 0.85, h = 0.2 } ]

# scale  : size relative to the Place footprint.
# anchor : where the asset's origin sits in its own 0..1 space. [0.5, 1.0] is bottom-centre,
#          so the building's feet land on the ground.
[[places.research_lab.anchors]]
role = "spawn"
x = 1.05
y = 0.0

[[places.research_lab.anchors]]
role = "label"
x = 0.0
y = 0.42

# Its asset is 1.7x its footprint, so the footprint fallback would leave most of the building
# unclickable. A Place should be reachable where it LOOKS reachable, which is why this is
# World data rather than a rule in the renderer.
[[places.research_lab.anchors]]
role = "interaction_bounds"
x = 0.0
y = -0.55
w = 0.9
h = 0.75

# ---------------------------------------------------------------------------
# The Automation Hub - Quests are orchestrated here.
