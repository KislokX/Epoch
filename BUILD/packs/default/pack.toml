  { x = 0.0, y = 0.0 }, { x = 3600.0, y = 0.0 },
  { x = 3600.0, y = 2200.0 }, { x = 0.0, y = 2200.0 },
]

# Old forest along the north-west edge: the world continues past what we can see.
[[map.terrain]]
