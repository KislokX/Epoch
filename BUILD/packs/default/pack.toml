# --- roads ---
#
# THIS PACK SHIPS NONE, DELIBERATELY.
#
# A pack still may: `[[map.routes]]` with `from`, `to` and `prominence`, naming the Places it
# joins by IDENTITY, so a World layered on top may rename the Laboratory, restyle it or replace
# its asset entirely and the road still arrives.
#
# It ships none because a World arrives to be shaped. Roads are the first thing its owner
# decides, and four already drawn between somebody else's buildings are four decisions taken
# away before they arrived. World Editor's ROAD tool draws them; they are saved in the vault,
# beside the names and positions that are already theirs (ADR-0028).
#
# What was here before also stopped being true. These four carried `waypoints` - corners that
# bent a road around water - authored against the positions THIS FILE used to hold. Positions
# moved to the user; the corners stayed here, anchored to nothing. A user who painted their own
# 1536x1024 land and moved the buildings into it got roads that ran out into open ocean and
# back. `waypoints` is no longer part of the contract: a corner belongs to whoever placed the
# buildings.

# ---------------------------------------------------------------- the interface
#
# This World draws its own windows (ADR-0016, `ui.*`). One image and the corner inset in its own
# pixels; the renderer cuts the nine-slice from exactly those two facts.
#
# The insets are **measured from the artwork**, not chosen: a bevel lit from above is not
# symmetric, and one number would have stretched the highlight or eaten into the face.
#   top 11 · right 5 · bottom 12 · left 6
#
# `stretch` because the face is a soft vertical gradient — repeating it bands. A tiled pattern
# would say `repeat`.

