# ===========================================================================
# GEOGRAPHY
# ===========================================================================
#
# The land, and the roads across it. Where Places SIT is no longer here - position belongs
# to the Place, with its identity.
#
# All coordinates are WORLD UNITS, never pixels. Pixels belong to the viewport;
# world units belong to the place.
#
# The engine never reads any of this. It knows only which place a character is in
# (ADR-0018). Geography is presentation, so it lives here (ADR-0016) -- which means a
# different World is a genuinely different world, and the engine cannot tell.
#
# Geography is UX (Build From Life 18). Every choice below says something:
#
#   The Command Center sits at the centre where four roads meet    -> it directs everything
#   The Guild sits close to it, on the busiest road                -> collaboration is constant
#   The Laboratory stands on a plateau at the mountains' foot      -> experimentation, set apart
#   The Automation Hub lies north beyond a forest                  -> it runs unattended
#   The Library is isolated across a river, reached by one bridge  -> focus, and connection
#   The south and east are empty                                   -> that is where cities go
#
# The world is deliberately far larger than the occupied area.

[map.size]
width = 3600.0
height = 2200.0

# --- terrain, in draw order (later areas sit on top) ---

# Grass base: the whole world.
[[map.terrain]]
kind = "grass"
