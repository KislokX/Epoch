# Building the installer somewhere a person can check.
#
# ## Why this exists at all, when the installer already builds locally
#
# It does, and a file built on somebody's desktop is a file whose only evidence is that they say
# so. Epoch is not signed — a code-signing certificate is a recurring cost, and buying one to
# remove a warning is not where this project's money goes — so what replaces a signature has to
# be something a stranger can verify without trusting the author:
#
# | | what it proves |
# |---|---|
# | `SHA256SUMS` | the file you have is the file this job produced |
# | build provenance | *this* file came from *this* commit of *this* repository, on GitHub's runners |
#
# The second is the one worth having. GitHub signs an attestation through Sigstore, and
# `gh attestation verify Epoch_Setup.exe --repo <owner>/<repo>` checks it against a transparency
# log — so a tampered installer cannot claim to have come from here, whatever it is called and
# wherever it was downloaded.
#
# **Neither of them stops SmartScreen.** Nothing but reputation or an EV certificate does, and
# saying otherwise would be the kind of claim this repository exists to avoid. What they do is
# make *"is this the real one?"* an answerable question, which is the half that was missing.
#
# ## On demand and on a tag
#
# This compiles a Rust workspace and a frontend from cold. Running it because somebody fixed a
# comment would be minutes of somebody else's electricity for nothing.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # **Nothing is published until the gates pass on this exact commit.**
  #
  # The audit put it plainly: provenance accredits where an artefact comes from, not that it
  # survived QA. Before this, a tag could produce a signed installer while MSRV, the tests, the
  # lints and the dependency policy were all failing — and the attestation would be perfectly
  # valid about a build nobody had checked.
  #
  # This is the whole of `ci.yml`, not a copy of its steps. A second list of gates is a list that
  # drifts, and the one that drifts is always the one nobody runs.
  gates:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: gates
    runs-on: windows-latest

    permissions:
      contents: read
      # What the attestation needs, and the reason these are here rather than at the top: a job
      # that only builds should not be able to write, and this one signs a statement about what
      # it built.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: BUILD

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BUILD/ui/package-lock.json

      - name: Install
        working-directory: BUILD/ui
        run: npm ci

      # `tauri build` runs the frontend's own build first (`beforeBuildCommand`), so this is the
      # whole application: the bundle the installer carries and the engine behind it.
      - name: The installer
        working-directory: BUILD/ui
        run: npm run world:build

      # **The one file somebody downloads.**
      #
      # `epoch-setup` carries the app's own installer inside it, so a person runs one program
      # rather than a program and a list of instructions — which is the whole reason that crate
      # exists, and it was never built here. The order is not optional: its `build.rs` embeds the
      # installer the step above produced, and a setup built first carries nothing and says so at
      # runtime.
      #
      # **It embeds the NSIS installer, not the MSI, and that was measured rather than chosen.**
      # Carrying the MSI made this file unusable for the person it is written for: perMachine,
      # run `/qn`, so an ordinary double-click answered `Error 1925 — you do not have sufficient
      # privileges` with no UAC prompt it could even offer. See `crates/epoch-setup/build.rs`.
      #
      # Not bundled — `bundle.active` is false in its own config. This binary *is* the artefact.
      - name: Setup, with Epoch inside it
        working-directory: BUILD
        run: cargo build --release -p epoch-setup

      # **Printed into the log as well as written beside the files.** A list of checksums that
      # travels with the thing it describes proves only that they arrived together; the copy in
      # the log took a different path.
      # **Two artefacts, and the MSI is deliberately not one of them.**
      #
      # `tauri build` still produces it and nothing consumes it any more — `epoch-setup` used to,
      # and that was the defect. `InstallScope="perMachine"`, into Program Files, while every
      # other part of Epoch is per user: the program in `%LOCALAPPDATA%`, `SetShellVarContext
      # current` in the uninstall hook, the vault under `%APPDATA%`. Its uninstall has no
      # delete-app-data option and never runs that hook, so publishing it would offer a second
      # way in that nothing here has measured. One installation path, and it is the one the tests
      # are about.
      #
      # **The names written here are the names the person checking will have.** A Release page is
      # flat -- `gh release create` uploads every asset under its basename -- while these files
      # are built two directories apart, so `sha256sum` run over the tree wrote
      # `./nsis/Epoch_0.1.0_x64-setup.exe`. That path resolves to nothing next to a download.
      #
      # Measured on the v0.1.0 draft, downloading it the way the README tells somebody to:
      # `./epoch-setup.exe: OK`, then `./nsis/...: FAILED open or read`, exit 1. Both files were
      # byte-for-byte correct; the instrument was the broken part, and it failed in the direction
      # that reads as tampering -- which is the worst way for the thing that replaces a signature
      # to be wrong.
      #
      # So each hash is taken from inside its own directory, and a collision between two files
      # that share a basename stops the build rather than publishing two lines nobody can tell
      # apart.
      - name: What this job produced
        shell: bash
        run: |
          set -euo pipefail
          out=BUILD/target/release/bundle
          cp BUILD/target/release/epoch-setup.exe "$out/"
          (
            cd "$out"
            find . -type f -name '*.exe' | sort > /tmp/exes
            if [ "$(wc -l < /tmp/exes)" -ne "$(xargs -n1 basename < /tmp/exes | sort -u | wc -l)" ]; then
              echo "two artefacts share a basename; the Release page cannot hold both" >&2
              exit 1
            fi
            : > SHA256SUMS
            while read -r f; do
              ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" )
            done < /tmp/exes >> SHA256SUMS
          )
          cat "$out/SHA256SUMS"


      # **What is inside the thing you just downloaded.**
      #
      # A checksum says the file is the one this job produced; provenance says the job ran here
      # on this commit. Neither says what the binary *contains* — and that is the question
      # somebody actually has to answer, months later, the day an advisory lands on a crate they
      # have never heard of. 509 Rust components in the application and 294 in the other program:
      # nobody reads that from a lockfile by hand, and reconstructing the tree of a version
      # already distributed is work at the worst possible moment.
      #
      # Two producers because there are two ecosystems and each already knows its own: `npm sbom`
      # ships with npm, and `cargo-cyclonedx` is pinned so a new release of it cannot silently
      # change the shape of a published record. CycloneDX because `cargo deny` already speaks the
      # same licence vocabulary this fills in.
      #
      # It is **attested with the installer**, not beside it: an unsigned parts list is a claim,
      # and the one thing worth knowing about a parts list is that it came from the build it
      # describes.
      - name: Install the parts-list tool
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: What is inside it
        shell: bash
        run: |
          set -euo pipefail
          out=BUILD/target/release/bundle
          mkdir -p "$out"
          (cd BUILD && cargo cyclonedx --format json --spec-version 1.5 --manifest-path crates/epoch-tauri/Cargo.toml)
          cp BUILD/crates/epoch-tauri/epoch-tauri.cdx.json "$out/epoch.cargo.cdx.json"
          # **And the wrapper, because that is the file somebody downloads.** Setup carries the
          # application inside it and is not the same tree: 320 components against the app's 511,
          # overlapping but neither a subset of the other. One parts list per artefact, or the
          # record describes something other than what was published.
          (cd BUILD && cargo cyclonedx --format json --spec-version 1.5 --manifest-path crates/epoch-setup/Cargo.toml)
          cp BUILD/crates/epoch-setup/epoch-setup.cdx.json "$out/epoch-setup.cargo.cdx.json"
          (cd BUILD/ui && npm sbom --sbom-format cyclonedx) > "$out/epoch.npm.cdx.json"
          # **A parts list nobody looked at is a file, not a record.** `grep` rather than `jq`
          # or `python3`: neither was measured on this machine, and a release step that has
          # never run is what the gates were added to stop. One `bom-ref` per component plus
          # the document's own, so this is a floor rather than an exact count — enough to fail
          # loudly on an empty or truncated document, which is the failure worth catching.
          for f in "$out"/*.cdx.json; do
            grep -q '"bomFormat"' "$f" || { echo "$f is not a CycloneDX document"; exit 1; }
            echo "$f  $(grep -o '"bom-ref"' "$f" | wc -l) entries"
          done

      # This is what a signature would have bought, minus the part that costs money: not *who
      # made it*, but *where it came from*, checkable by anybody with `gh`.
      - name: Where these came from
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            BUILD/target/release/bundle/nsis/*.exe
            BUILD/target/release/bundle/epoch-setup.exe
            BUILD/target/release/bundle/*.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epoch-windows
          path: |
            BUILD/target/release/bundle/nsis/*.exe
            BUILD/target/release/bundle/epoch-setup.exe
            BUILD/target/release/bundle/SHA256SUMS
            BUILD/target/release/bundle/*.cdx.json
          if-no-files-found: error

  # **Somewhere a person can actually download from.**
  #
  # A build artefact is attached to a workflow run: it expires, and it takes a signed-in browser
  # to reach. Everything above exists so that a stranger can check what they downloaded, and all
  # of it was landing somewhere a stranger cannot get to.
  #
  # **A separate job, for the reason the one above has `contents: read`.** A job that builds must
  # not be able to write to the repository, and a job that publishes has no business compiling
  # anything. This one downloads what was built and attested and does nothing else — so what it
  # publishes is the artefact the attestation is about, rather than a second build of the same
  # commit that would have a different checksum.
  #
  # **A draft, on purpose.** The owner reads it and presses the button. Everything worth checking
  # — the checksums, `gh attestation verify`, installing from the downloaded file rather than a
  # local one — works against a draft, and if any of it fails there was never anything published
  # to withdraw.
  publish:
    needs: windows
    # Only a tag is a release. `workflow_dispatch` stays useful for proving the build without
    # producing something that looks like one.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: epoch-windows
          path: release

      # `gh` is on the runner already. A third-party action for what is one command would be one
      # more thing to pin, review and trust.
      #
      # The notes go through a file rather than a flag: they are Markdown with backticks and
      # newlines in them, and quoting that through a shell argument is a way to publish something
      # subtly different from what was written.
      - name: A draft, with everything beside it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find release -type f | sort

          cat > notes.md <<'NOTES'
          **An AI operating system that is a place, not a dashboard.**

          Most AI tools are a text box with a history. Epoch is a **world you enter**. Your crew are
          characters who live somewhere — they have faces, routines and a place they stand in. When one of
          them is thinking you can see where, and when nothing is running the world is quiet, because that
          quiet is true rather than a spinner.

          Underneath it is an engine: local models, hosted models, coding agents, image, video, sound and
          3D generation, MCP servers, and the other machines on your network — all behind one way of
          working. There is no Docker to learn, no YAML to write and no node graph to wire.

          > **North star: AI should never be harder to use than a video game.**

          ## What is in this first release

          You do not start in a chat. You start on the bridge of a docked ship: nine decks, each answering
          one question about your setup, all of it configured in the product with no file to edit.

          | | |
          |---|---|
          | **WORLDS** | A project with a place attached — a map, buildings, roads and a crew. Each World holds a project root (your real codebase, read the way a coding agent reads it) and a knowledge folder, both chosen by you and never guessed |
          | **CHARACTERS** | A character is a portable asset, not a row in a settings table: name, face, sprite, role, prompt, parameters and which Worlds they live in. Their brain may be a local model, Claude Code, Codex, Gemini CLI, or a model on another machine — and changing it does not change who they are |
          | **CREATIONS** | Pictures, video, sound and 3D through ComfyUI, here or on a machine you paired. Styles are yours to name; the library is one folder Epoch adds as a search path and **never moves, copies or renames** a file you already had |
          | **MODELS** | Every model you have, with numbers Epoch measured rather than guessed: tokens per second, the context it was measured at, and the memory it actually took. `BENCHMARK & OPTIMIZE` runs a real timed search and writes the winner as a profile |
          | **CONNECTIONS** | Ollama, llama.cpp and LM Studio found and configured without asking twice; any server speaking the OpenAI API at any address; hosted models with a key you supply. Coding agents sign in through **their own** window — Epoch opens the door and never holds the key |
          | **MACHINES** | Pair another computer and its models become brains your crew can use. A code, typed once, spent the moment it works. No account and no cloud |
          | **MCP** | Connect any MCP server and its tools reach your crew. Epoch also *is* one: an agent connected to it gains your crew, the Quest and its Chronicle, this World's knowledge, and the servers already configured here |
          | **WORKSHOP** | Search, weigh against this machine, install — models, checkpoints and LoRAs, 175 Piper voices, MCP servers |
          | **SETTINGS** | Your machine, grouped by what each thing actually affects |

          **Quests own the work.** You do not delegate a task to an AI; you start a Quest, and the crew
          collaborate to finish it. History is built from evidence rather than narration — a Quest that
          produced nothing says so, and a failure is remembered as the failure it was.

          **Every reading is measured or visibly empty.** A panel with nothing behind it keeps its frame,
          loses its light and says which subsystem will light it up. A gauge nobody can explain is worse
          than no gauge.

          ## What is not here

          Windows only. The code is cross-platform and the release matrix is not; macOS and Linux builds
          are not published yet, and that is stated rather than promised.

          Epoch installs **per user**, into `%LOCALAPPDATA%\Epoch`, and keeps its vault and model library
          in `%APPDATA%\Epoch`. Uninstalling leaves both alone unless you tick the box that says otherwise.

          ## Which file

          | | |
          |---|---|
          | **`epoch-setup.exe`** | The one to download. It carries Epoch inside it and offers what this machine does not have yet. Decline all of it and Epoch still opens, and says what is missing |
          | `Epoch_0.1.0_x64-setup.exe` | The plain installer, for somebody who wants only the application |

          ## Checking what you have

          Epoch is **unsigned**, and that is a decision rather than an omission: a certificate is a
          recurring cost and it buys *who made this*, which is the half a stranger can least act on. The
          half you can check is free and ships with every release.

          ```
          sha256sum -c SHA256SUMS
          gh attestation verify epoch-setup.exe --repo OWNER_REPO
          ```

          The first says the file you have is the file this job produced. The second says it came from this
          commit of this repository, built on GitHub's own runners and signed through a public transparency
          log — so a tampered installer cannot claim to have come from here, whatever it is called and
          wherever it was downloaded.

          **Neither of them stops SmartScreen**, and nothing here pretends otherwise: only reputation or an
          EV certificate does. Windows will warn about an unrecognised app; *More info* then *Run anyway* is
          the way past it, and the two commands above are how you decide whether you want to.

          The `.cdx.json` files are CycloneDX parts lists — one for the application, one for setup, one for
          the frontend. They exist for the day an advisory lands on something in the tree and somebody has
          to know whether this build contained it.
          NOTES
          sed -i "s|OWNER_REPO|${GITHUB_REPOSITORY}|" notes.md

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            $(find release -type f | sort)
